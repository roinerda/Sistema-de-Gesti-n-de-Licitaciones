# Plantilla del Secret. NO se aplica tal cual y NO debe copiarse con valores reales
# a este repositorio: el archivo con las credenciales verdaderas (k8s/app-secret.yaml)
# está excluido en .gitignore.
#
# Uso:
#   cp k8s/app-secret.example.yaml k8s/app-secret.yaml
#   # edite los valores
#   kubectl apply -f k8s/app-secret.yaml
#
# O bien, sin escribir ningún archivo:
#   kubectl create secret generic licitaciones-secret \
#     --namespace licitaciones \
#     --from-literal=POSTGRES_USER=licitaciones \
#     --from-literal=POSTGRES_PASSWORD='...' \
#     --from-literal=POSTGRES_DB=licitaciones
apiVersion: v1
kind: Secret
metadata:
  name: licitaciones-secret
  namespace: licitaciones
  labels:
    app.kubernetes.io/name: licitaciones
type: Opaque
stringData:
  POSTGRES_USER: "licitaciones"
  POSTGRES_PASSWORD: "CAMBIE-ESTA-CLAVE"
  POSTGRES_DB: "licitaciones"
