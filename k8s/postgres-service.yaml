# Servicio interno del motor de base de datos. No se expone fuera del clúster:
# solo la aplicación necesita alcanzarlo.
apiVersion: v1
kind: Service
metadata:
  name: licitaciones-postgres
  namespace: licitaciones
  labels:
    app.kubernetes.io/name: licitaciones
    app.kubernetes.io/component: base-datos
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: licitaciones
    app.kubernetes.io/component: base-datos
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
