# Motor de base de datos. Se despliega como StatefulSet porque tiene identidad y
# almacenamiento propios: no es una réplica intercambiable como la aplicación.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: licitaciones-postgres
  namespace: licitaciones
  labels:
    app.kubernetes.io/name: licitaciones
    app.kubernetes.io/component: base-datos
spec:
  serviceName: licitaciones-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: licitaciones
      app.kubernetes.io/component: base-datos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: licitaciones
        app.kubernetes.io/component: base-datos
    spec:
      securityContext:
        # La imagen oficial de PostgreSQL corre con el usuario postgres (UID 999).
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: licitaciones-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: licitaciones-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: licitaciones-secret
                  key: POSTGRES_PASSWORD
            # El directorio de datos cuelga de un subdirectorio del volumen para que
            # la imagen pueda inicializarlo aunque el punto de montaje ya exista.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: TZ
              value: America/Costa_Rica
          volumeMounts:
            - name: datos
              mountPath: /var/lib/postgresql/data
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready --username=$POSTGRES_USER --dbname=$POSTGRES_DB"]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready --username=$POSTGRES_USER --dbname=$POSTGRES_DB"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready --username=$POSTGRES_USER --dbname=$POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: licitaciones-postgres-datos
